name: Discover articles across configured sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/sources.json"
      - "scripts/crawl_sources.py"
      - "scripts/build_recent_posts.py"
      - ".github/workflows/crawl-sources.yml"
  schedule:
    - cron: "47 7 * * *"

permissions:
  contents: write

concurrency:
  group: crawl-editorial-sources
  cancel-in-progress: false

jobs:
  discover-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax before running the crawler
        run: python -m py_compile scripts/discover_feeds.py scripts/crawl_sources.py scripts/build_recent_posts.py

      - name: Validate RSS and Atom feeds for all 21 configured sources
        run: python scripts/discover_feeds.py

      - name: Discover new article URLs using validated feeds and sitemaps
        run: python scripts/crawl_sources.py

      - name: Build chronological posts from the last 90 days
        run: python scripts/build_recent_posts.py

      - name: Validate generated editorial data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl, urlencode, urlunsplit

          root = Path(".")
          payload = json.loads((root / "data/posts.json").read_text(encoding="utf-8"))
          posts = payload.get("posts")
          assert isinstance(posts, list), "data/posts.json must contain a posts array"
          assert payload.get("post_count") == len(posts), "post_count does not match posts array"
          seen = set()
          for index, post in enumerate(posts):
              assert post.get("title", "").strip(), f"post {index} has no title"
              assert post.get("excerpt", "").strip(), f"post {index} has no excerpt"
              url = post.get("source_url") or post.get("url") or ""
              parsed = urlsplit(url)
              assert parsed.scheme in ("http", "https") and parsed.netloc, f"post {index} has invalid source URL"
              query = [(k, v) for k, v in parse_qsl(parsed.query, keep_blank_values=True)
                       if k.lower() not in {"fbclid", "gclid", "dclid", "mc_cid", "mc_eid", "replytocom", "ref", "source"}
                       and not k.lower().startswith("utm_")]
              canonical = urlunsplit((parsed.scheme.lower(), parsed.netloc.lower(), parsed.path.rstrip("/") or "/", urlencode(sorted(query)), ""))
              assert canonical not in seen, f"duplicate canonical article URL: {url}"
              seen.add(canonical)
          for path in ("data/discovered-articles.json", "data/source-status.json"):
              json.loads((root / path).read_text(encoding="utf-8"))
          print(f"Validated {len(posts)} posts; canonical URLs are unique; source/discovery JSON is valid.")
          PY

      - name: Commit discovery queue and posts when changed
        run: |
          git add -N data/source-status.json data/discovered-articles.json data/posts.json
          if git diff --quiet -- data/source-status.json data/discovered-articles.json data/posts.json; then
            echo "Feed status, discovery queue and posts did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/discovered-articles.json data/posts.json
          git commit -m "chore: validate all sources and refresh editorial queue"
          git pull --rebase -X theirs origin main
          git push
