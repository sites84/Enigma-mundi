name: Discover articles across configured sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/sources.json"
      - "scripts/crawl_sources.py"
      - "scripts/build_recent_posts.py"
      - ".github/workflows/crawl-sources.yml"
  schedule:
    - cron: "47 7 * * *"

permissions:
  contents: write

concurrency:
  group: crawl-editorial-sources
  cancel-in-progress: false

jobs:
  discover-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate RSS and Atom feeds for all 21 configured sources
        run: python scripts/discover_feeds.py

      - name: Discover new article URLs using validated feeds and sitemaps
        run: python scripts/crawl_sources.py

      - name: Build chronological posts from the last 90 days
        run: python scripts/build_recent_posts.py

      - name: Commit discovery queue and posts when changed
        run: |
          git add -N data/source-status.json data/discovered-articles.json data/posts.json
          if git diff --quiet -- data/source-status.json data/discovered-articles.json data/posts.json; then
            echo "Feed status, discovery queue and posts did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/discovered-articles.json data/posts.json
          git commit -m "chore: validate all sources and refresh editorial queue"
          git pull --rebase -X theirs origin main
          git push
